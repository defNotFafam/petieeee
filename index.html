<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>For Mama💗</title>
<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;600;700&family=Nunito:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #FFF3F6;
    --bg2: #FFE8EF;
    --ink: #5A3E45;
    --pink: #F0839F;
    --pink-deep: #E56B8B;
    --lilac: #C9A6E0;
    --line: rgba(90,62,69,0.14);
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  * { box-sizing: inherit; }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #2B1F26;
      --bg2: #35242D;
      --ink: #FBE7ED;
      --line: rgba(251,231,237,0.16);
    }
  }
  :root[data-theme="dark"] {
    --bg: #2B1F26;
    --bg2: #35242D;
    --ink: #FBE7ED;
    --line: rgba(251,231,237,0.16);
  }

  html, body {
    height: 100%;
    margin: 0;
    background: linear-gradient(180deg, var(--bg) 0%, var(--bg2) 100%);
    color: var(--ink);
    font-family: 'Nunito', -apple-system, sans-serif;
  }

  .wrap {
    max-width: 920px;
    margin: 0 auto;
    padding: 3.5rem 1.5rem 5rem;
  }

  header {
    margin-bottom: 2.8rem;
    text-align: left;
    position: relative;
  }

  .doodle {
    position: absolute;
    top: -0.6rem;
    left: -0.3rem;
    font-size: 1.6rem;
    transform: rotate(-8deg);
    opacity: 0.9;
  }

  h1 {
    font-family: 'Quicksand', sans-serif;
    font-weight: 700;
    font-size: clamp(2.4rem, 7vw, 3.6rem);
    line-height: 1.05;
    margin: 0 0 0.6rem;
    color: var(--pink-deep);
  }

  .sub {
    font-size: 1.05rem;
    color: var(--ink);
    opacity: 0.7;
    max-width: 42ch;
    line-height: 1.55;
    margin: 0;
  }

  .gallery {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
    gap: 1.5rem;
  }

  .frame {
    position: relative;
    aspect-ratio: 4 / 5;
    border-radius: 22px;
    overflow: hidden;
    border: 2.5px solid var(--line);
    background: linear-gradient(145deg, rgba(240,131,159,0.14), rgba(201,166,224,0.14));
    transition: transform 0.15s ease, border-color 0.15s ease;
  }

  .frame:nth-child(5n+1) { transform: rotate(-1.4deg); }
  .frame:nth-child(5n+2) { transform: rotate(1.2deg); }
  .frame:nth-child(5n+3) { transform: rotate(-0.8deg); }
  .frame:nth-child(5n+4) { transform: rotate(1.6deg); }
  .frame:nth-child(5n+5) { transform: rotate(-0.5deg); }

  .frame img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }

  .frame.placeholder {
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 1rem;
    border-style: dashed;
  }

  .placeholder-inner {
    text-align: center;
    opacity: 0.55;
  }

  .placeholder-inner svg {
    width: 30px;
    height: 30px;
    margin-bottom: 0.5rem;
    fill: var(--pink);
  }

  .placeholder-inner p {
    font-family: 'Quicksand', sans-serif;
    font-weight: 600;
    font-size: 0.82rem;
    margin: 0;
    line-height: 1.4;
    color: var(--pink-deep);
  }

  .frame:has(img[src]) .placeholder-inner { display: none; }
  .frame:has(img[src]) { border-style: solid; }

  footer {
    margin-top: 3.5rem;
    padding-top: 1.5rem;
    border-top: 2px dashed var(--line);
    font-size: 0.85rem;
    opacity: 0.6;
    line-height: 1.6;
  }

  footer code {
    background: var(--line);
    padding: 0.15rem 0.45rem;
    border-radius: 6px;
    font-size: 0.8rem;
  }
</style>
</head>
<body>
  <div class="wrap">
    <header>
      <span class="doodle">✨</span>
      <h1>For Mama 💗</h1>
      <p class="sub">A little surprise, FOR A BIG CUTIEEEE 💗</p>
    </header>

    <div class="gallery">

      <!-- ============================================================
           HOW TO ADD YOUR OWN PHOTOS
           Replace the empty src="" on each tile below with a path
           or link to your image, e.g.:
             <img src="us-at-the-park.jpg" alt="At the park">
           Once src has a value, the placeholder heart disappears
           automatically and your photo fills the frame.
           ============================================================ -->

      <div class="frame placeholder">
        <img src="1.jpg" alt="">
        <div class="placeholder-inner">
          <svg viewBox="0 0 24 24"><path d="M12 21s-6.7-4.35-9.3-8.1C1 10.2 1.6 6.9 4.3 5.4c2.1-1.15 4.4-.5 5.7 1.15L12 8.6l2-2.05c1.3-1.65 3.6-2.3 5.7-1.15 2.7 1.5 3.3 4.8 1.6 7.5C18.7 16.65 12 21 12 21z"/></svg>
          <p>add photo</p>
        </div>
      </div>

      <div class="frame placeholder">
        <img src="2.jpg" alt="">
        <div class="placeholder-inner">
          <svg viewBox="0 0 24 24"><path d="M12 21s-6.7-4.35-9.3-8.1C1 10.2 1.6 6.9 4.3 5.4c2.1-1.15 4.4-.5 5.7 1.15L12 8.6l2-2.05c1.3-1.65 3.6-2.3 5.7-1.15 2.7 1.5 3.3 4.8 1.6 7.5C18.7 16.65 12 21 12 21z"/></svg>
          <p>add photo</p>
        </div>
      </div>

      <div class="frame placeholder">
        <img src="3.jpg" alt="">
        <div class="placeholder-inner">
          <svg viewBox="0 0 24 24"><path d="M12 21s-6.7-4.35-9.3-8.1C1 10.2 1.6 6.9 4.3 5.4c2.1-1.15 4.4-.5 5.7 1.15L12 8.6l2-2.05c1.3-1.65 3.6-2.3 5.7-1.15 2.7 1.5 3.3 4.8 1.6 7.5C18.7 16.65 12 21 12 21z"/></svg>
          <p>add photo</p>
        </div>
      </div>

      <div class="frame placeholder">
        <img src="4.jpg" alt="">
        <div class="placeholder-inner">
          <svg viewBox="0 0 24 24"><path d="M12 21s-6.7-4.35-9.3-8.1C1 10.2 1.6 6.9 4.3 5.4c2.1-1.15 4.4-.5 5.7 1.15L12 8.6l2-2.05c1.3-1.65 3.6-2.3 5.7-1.15 2.7 1.5 3.3 4.8 1.6 7.5C18.7 16.65 12 21 12 21z"/></svg>
          <p>add photo</p>
        </div>
      </div>

      <div class="frame placeholder">
        <img src="5.jpg" alt="">
        <div class="placeholder-inner">
          <svg viewBox="0 0 24 24"><path d="M12 21s-6.7-4.35-9.3-8.1C1 10.2 1.6 6.9 4.3 5.4c2.1-1.15 4.4-.5 5.7 1.15L12 8.6l2-2.05c1.3-1.65 3.6-2.3 5.7-1.15 2.7 1.5 3.3 4.8 1.6 7.5C18.7 16.65 12 21 12 21z"/></svg>
          <p>add photo</p>
        </div>
      </div>

    </div>

    <footer>
      made with love 🩷
      <br>      
            FOR A LOVE 🌸
    </footer>
  </div>
</body>
</html>
